name: chat_image_editor_example
description: "Example app for chat_image_editor."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  chat_image_editor:
    path: ../
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Build iOS and macOS plugins with Swift Package Manager instead of CocoaPods.
  config:
    enable-swift-package-manager: true
