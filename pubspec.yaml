name: chat_image_editor
description: >-
  A lightweight, WhatsApp-style image editor for chat apps: draw, add text,
  crop, rotate, compress and send with a caption. Pure Dart, fully themeable.
version: 1.0.0
repository: https://github.com/ashiqu-ali/chat_image_editor
issue_tracker: https://github.com/ashiqu-ali/chat_image_editor/issues
topics:
  - image-editor
  - image
  - crop
  - drawing
  - chat

screenshots:
  - description: Draw arrows, shapes and freehand with a color strip.
    path: doc/screenshots/draw.png
  - description: Text layers with backgrounds, a caption and a send button.
    path: doc/screenshots/text.png
  - description: Crop, rotate and flip with aspect-ratio presets.
    path: doc/screenshots/crop.png
  - description: Compress with a live size estimate.
    path: doc/screenshots/compress.png
  - description: Done mode with a custom theme.
    path: doc/screenshots/done_mode.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
