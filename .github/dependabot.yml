version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: pub
    directory: /example
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, example]
    commit-message:
      prefix: build
      include: scope
    groups:
      example-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
